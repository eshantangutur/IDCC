<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cases | Argument Forensics</title>
  <meta name="color-scheme" content="dark light">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M16 6l2.4 6.2 6.6 2.4-6.6 2.4L16 23l-2.4-6L7 14.6l6.6-2.4z' fill='%232563EB'/%3E%3C/svg%3E">
</head>
<body data-page="cases">
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar" aria-label="Workspace navigation"></aside>
    <div class="app-body">
      <header class="topbar" id="appTopbar"></header>
      <main class="page">
        <div class="page-header">
          <div>
            <h1>Cases</h1>
            <p>Save resolutions, sides, and contentions. Attach speeches so reports stay with the case.</p>
          </div>
          <button type="button" class="btn btn-primary" id="newCaseButton">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>New case</span>
          </button>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input class="input" id="caseSearch" type="search" placeholder="Search cases" aria-label="Search cases">
          </div>
          <select class="select" id="caseFormatFilter" aria-label="Filter by format">
            <option value="">All formats</option>
          </select>
          <span class="tiny muted" id="caseCount" style="margin-left:auto"></span>
        </div>

        <div id="caseGrid" class="case-grid" style="margin-top:18px"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/js/cases.js"></script>
</body>
</html>
