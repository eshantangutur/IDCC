<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rounds | Argument Forensics</title>
  <meta name="description" content="Build a debate round, add every speech, and reconstruct how the arguments developed.">
  <meta name="color-scheme" content="dark light">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/rounds.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M16 6l2.4 6.2 6.6 2.4-6.6 2.4L16 23l-2.4-6L7 14.6l6.6-2.4z' fill='%232563EB'/%3E%3C/svg%3E">
</head>
<body data-page="rounds">
  <div class="app-shell">
    <aside class="sidebar" id="appSidebar"></aside>
    <div class="app-body">
      <header class="topbar" id="appTopbar"></header>
      <main class="page">
        <div class="page-header">
          <div>
            <h1>Rounds</h1>
            <p class="muted" style="margin:6px 0 0">A round keeps every speech in order, then tracks each argument across them.</p>
          </div>
          <div class="row" style="gap:8px">
            <button type="button" class="btn btn-primary" id="newRoundBtn">New round</button>
          </div>
        </div>

        <div class="toolbar" style="margin:16px 0">
          <div class="search-wrap">
            <span class="search-wrap__icon" aria-hidden="true"></span>
            <input type="search" class="input" id="roundSearch" placeholder="Search rounds" aria-label="Search rounds">
          </div>
          <select class="select" id="roundFormat" aria-label="Filter by format">
            <option value="">All formats</option>
          </select>
          <span class="grow"></span>
          <span class="tiny muted" id="roundCount">Loading...</span>
        </div>

        <section class="card" id="roundsPanel">
          <div id="roundsList" class="stack"><div class="skeleton" style="height:160px"></div></div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="/js/rounds.js"></script>
</body>
</html>
